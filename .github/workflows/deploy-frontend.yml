# deploy-frontend.yml
# Roda automaticamente quando há push na branch main com mudanças no frontend.
# Faz o build do React e publica no GitHub Pages.
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:   # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write   # necessário para o actions-gh-pages fazer push na branch gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm install

      - name: Build de produção
        working-directory: ./frontend
        env:
          # URL do backend no Fly.io — configurada nos Secrets do repositório GitHub
          # Settings → Secrets and variables → Actions → New repository secret
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
